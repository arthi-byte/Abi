<html>
<head>
<style>

* {
    box-sizing: border-box;
}

body {
    background-color: lightyellow;
    font-family: Arial;
    margin: 0;
}

#banner {
    background-color: blue;
    color: white;
    width: 100%;
    text-align: center;
    padding: 20px 0;
    animation: bannerGlow 3s infinite alternate;
}

@keyframes bannerGlow {
    from {
        box-shadow: 0 0 5px blue;
    }
    to {
        box-shadow: 0 0 25px purple;
    }
}
#banner h1 {
    animation: slideDown 1.5s ease;
}

#banner h2 {
    animation: zoomIn 1.5s ease;
}

@keyframes slideDown {
    from {
        transform: translateY(-40px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

@keyframes zoomIn {
    from {
        transform: scale(0.5);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

#details {
    display: flex;
    gap: 30px;
    margin: 30px;
}

#event-details {
    border: 3px solid black;
    background-color: lightblue;
    padding: 20px;
    width: 50%;
    border-radius: 10px;
    animation: floatBox 3s infinite alternate;
    transition: background-color 0.5s, transform 0.5s;
}

#registration-events {
    border: 3px solid black;
    background-color: lightpink;
    padding: 20px;
    width: 50%;
    border-radius: 10px;
    animation: floatBox 3s infinite alternate-reverse;
    transition: background-color 0.5s, transform 0.5s;
}

@keyframes floatBox {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-10px);
    }
}

#event-details:hover {
    background-color: lightgreen;
    transform: scale(1.03);
}

#registration-events:hover {
    background-color: lightyellow;
    transform: scale(1.03);
}

h1 {
    text-align: center;
}

h3 {
    color: darkblue;
    transition: color 0.4s, transform 0.4s;
}

h3:hover {
    color: purple;
    transform: translateX(10px);
}

button {
    padding: 12px 25px;
    background-color: green;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    display: block;
    margin: 20px auto;
    animation: bounce 1s infinite alternate;
    transition: background-color 0.5s;
}

button:hover {
    background-color: darkgreen;
    transform: scale(1.15);
}

@keyframes bounce {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-8px);
    }
}

@media screen and (max-width: 600px) {

    body {
        background-color: lavender;
    }

    #banner {
        background-color: purple;
    }

    #details {
        flex-direction: column;
        margin: 15px;
    }

    #event-details {
        background-color: lightgreen;
        width: 100%;
    }

    #registration-events {
        background-color: lightyellow;
        width: 100%;
    }

    button {
        background-color: green;
        animation: bounce 0.8s infinite alternate;
    }
}

@media screen and (min-width: 601px) {

    body {
        background-color: lightyellow;
    }

    #banner {
        background-color: blue;
    }

    #event-details {
        background-color: lightblue;
    }

    #registration-events {
        background-color: lightpink;
    }

    button {
        background-color: green;
    }
}

</style>
</head>

<body>

<div id="banner">
    <h1>STC | Pollachi</h1>
    <h2>TARANG</h2>
    <p>It is an inter-college meet fest, happening on 09-10-2026</p>
</div>

<div id="details">

    <div id="event-details">
        <h1>Event Details</h1>
        <h3>Quiz</h3>
        <h3>Connection</h3>
        <h3>Dancing</h3>
    </div>

    <div id="registration-events">
        <h1>Registration Details</h1>
        <h3>Registration fee is 150. Registration ends on 08-10-2026.</h3>
    </div>

</div>

<button>Submit</button>

</body>
</html>
