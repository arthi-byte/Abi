<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
            padding: 40px;
        }

        .container {
            background-color: white;
            width: 300px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Grade Calculator</h2>

        <input type="number" id="mark1" placeholder="Enter Mark 1">
        <input type="number" id="mark2" placeholder="Enter Mark 2">
        <input type="number" id="mark3" placeholder="Enter Mark 3">
        <input type="number" id="mark4" placeholder="Enter Mark 4">
        <input type="number" id="mark5" placeholder="Enter Mark 5">

        <button onclick="grade()">Calculate Grade</button>

        <p id="result"></p>
    </div>

    <script>
        function grade() {
            let mark1 = Number(document.getElementById("mark1").value);
            let mark2 = Number(document.getElementById("mark2").value);
            let mark3 = Number(document.getElementById("mark3").value);
            let mark4 = Number(document.getElementById("mark4").value);
            let mark5 = Number(document.getElementById("mark5").value);

            if (
                document.getElementById("mark1").value === "" ||
                document.getElementById("mark2").value === "" ||
                document.getElementById("mark3").value === "" ||
                document.getElementById("mark4").value === "" ||
                document.getElementById("mark5").value === ""
            ) {
                document.getElementById("result").innerHTML =
                    "Please enter all five marks.";
                return;
            }

            if ([mark1, mark2, mark3, mark4, mark5].some(mark => mark < 0 || mark > 100)) {
                document.getElementById("result").innerHTML =
                    "Marks must be between 0 and 100.";
                return;
            }

            let sum = mark1 + mark2 + mark3 + mark4 + mark5;
            let avg = sum / 5;
            let result = "";

            if (avg >= 90) {
                result = "A Grade";
            } else if (avg >= 80) {
                result = "B Grade";
            } else if (avg >= 70) {
                result = "C Grade";
            } else if (avg >= 60) {
                result = "D Grade";
            } else if (avg >= 50) {
                result = "E Grade";
            } else {
                result = "Fail";
            }

            document.getElementById("result").innerHTML =
                "Total Marks: " + sum + "/500<br>" +
                "Average: " + avg.toFixed(2) + "%<br>" +
                "Grade: " + result;
        }
    </script>

</body>
</html>
